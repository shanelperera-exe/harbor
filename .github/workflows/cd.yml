name: CD Pipeline

on:
  workflow_run:
    workflows: [ "CI Pipeline" ]
    types: [ completed ]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: rg-harbor-centralindia
  ACA_ENVIRONMENT: harbor-env
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy-backend-apis:
    name: Deploy Backend APIs
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: Production
    strategy:
      matrix:
        include:
          - service: harbor-auth-api
            dockerfile: src/backend/Harbor.Authentication/Dockerfile
          - service: harbor-project-api
            dockerfile: src/backend/Harbor.Project/Dockerfile
          - service: harbor-env-api
            dockerfile: src/backend/Harbor.Environment/Dockerfile
          - service: harbor-deploy-api
            dockerfile: src/backend/Harbor.Deployment/Dockerfile
          - service: harbor-report-api
            dockerfile: src/backend/Harbor.Reporting/Dockerfile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Every URL below is derived from the environment's default domain instead of being
      # configured by hand. A Container App FQDN is always {appName}.{envDefaultDomain},
      # so these values are deterministic once harbor-env exists.
      - name: Resolve environment domain and auth FQDN
        id: get-domain
        run: |
          DOMAIN=$(az containerapp env show -n ${{ env.ACA_ENVIRONMENT }} -g ${{ env.RESOURCE_GROUP }} --query properties.defaultDomain -o tsv | tr -d '[:space:]')
          echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV

          # Read the auth API's FQDN from Azure rather than constructing it. The short name does
          # not resolve from another container app, and the documented .internal. FQDN resolves
          # but presents a certificate issued for the non-internal name. On the very first deploy
          # harbor-auth-api may not exist yet, so fall back to the constructed form.
          AUTH_FQDN=$(az containerapp show -n harbor-auth-api -g ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null | tr -d '[:space:]')
          if [ -z "$AUTH_FQDN" ]; then
            AUTH_FQDN="harbor-auth-api.$DOMAIN"
            echo "::warning::harbor-auth-api not found yet; falling back to $AUTH_FQDN"
          fi
          echo "AUTH_SERVICE_URL=https://$AUTH_FQDN" >> $GITHUB_ENV

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: ${{ env.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}
          containerAppName: ${{ matrix.service }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.ACA_ENVIRONMENT }}
          imageToBuild: ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ env.DEPLOY_SHA }}
          dockerfilePath: ${{ matrix.dockerfile }}
          ingress: internal
          targetPort: 8080

      - name: Apply backend runtime configuration
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ENVIRONMENT_SECRETS_KEY: ${{ secrets.ENVIRONMENT_SECRETS_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GH_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
          GH_APP_PRIVATE_KEY_BASE64: ${{ secrets.GH_APP_PRIVATE_KEY_BASE64 }}
          GH_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
          KAFKA_CONNECTION_STRING: ${{ secrets.KAFKA_CONNECTION_STRING }}
        run: |
          for attempt in 1 2 3; do
            if az containerapp update \
              --name "${{ matrix.service }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --set-env-vars \
                "POSTGRES_SERVER=${{ vars.POSTGRES_SERVER }}" \
                "POSTGRES_PORT=${{ vars.POSTGRES_PORT }}" \
                "POSTGRES_DATABASE=${{ vars.POSTGRES_DATABASE }}" \
                "POSTGRES_USER=${{ vars.POSTGRES_USER }}" \
                "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
                "POSTGRES_SSL_MODE=Require" \
                "JWT_SECRET=$JWT_SECRET" \
                "JWT_ISSUER=${{ vars.JWT_ISSUER }}" \
                "JWT_AUDIENCE=${{ vars.JWT_AUDIENCE }}" \
                "ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }}" \
                "ADMIN_PASSWORD=$ADMIN_PASSWORD" \
                "KAFKA_CONNECTION_STRING=$KAFKA_CONNECTION_STRING" \
                "SMTP_HOST=${{ vars.SMTP_HOST }}" \
                "SMTP_PORT=${{ vars.SMTP_PORT }}" \
                "SMTP_USERNAME=${{ vars.SMTP_USERNAME }}" \
                "SMTP_PASSWORD=$SMTP_PASSWORD" \
                "SMTP_FROM_NAME=${{ vars.SMTP_FROM_NAME }}" \
                "SMTP_FROM_EMAIL=${{ vars.SMTP_FROM_EMAIL }}" \
                "ENVIRONMENT_SECRETS_KEY=$ENVIRONMENT_SECRETS_KEY" \
                "GH_APP_ID=${{ vars.GH_APP_ID }}" \
                "GH_APP_CLIENT_ID=${{ vars.GH_APP_CLIENT_ID }}" \
                "GH_APP_CLIENT_SECRET=$GH_APP_CLIENT_SECRET" \
                "GH_APP_PRIVATE_KEY_BASE64=${{ secrets.GH_APP_PRIVATE_KEY_BASE64 }}" \
                "GH_APP_SLUG=${{ vars.GH_APP_SLUG }}" \
                "GH_APP_WEBHOOK_SECRET=$GH_APP_WEBHOOK_SECRET" \
                "GH_API_BASE_URL=${{ vars.GH_API_BASE_URL }}" \
                "GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}" \
                "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" \
                "AUTH_SERVICE_URL=$AUTH_SERVICE_URL" \
                "FRONTEND_URL=https://harbor-web-ui.$DOMAIN" \
                "API_GATEWAY_URL=https://harbor-api-gateway.$DOMAIN" \
                "ALLOWED_ORIGINS=https://harbor-admin-ui.$DOMAIN,https://harbor-web-ui.$DOMAIN" \
                "DISABLE_HTTPS_REDIRECTION=true" \
              --min-replicas 0 \
              --max-replicas 1 \
              --cpu 0.5 \
              --memory 1Gi; then
              exit 0
            fi
            echo "Azure Container Apps update failed (attempt $attempt/3); retrying..."
            sleep 15
          done
          exit 1

      # Without this, a silently skipped or partially-applied job leaves the previous revision
      # running, and the only symptom is a 502 from the gateway at login time.
      - name: Verify runtime configuration was applied
        run: |
          REDIRECT=$(az containerapp show -n ${{ matrix.service }} -g ${{ env.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].env[?name=='DISABLE_HTTPS_REDIRECTION'].value" -o tsv)
          if [ "$REDIRECT" != "true" ]; then
            echo "::error::${{ matrix.service }} is missing DISABLE_HTTPS_REDIRECTION=true. It would answer the gateway's internal HTTP call with a 307 to https://harbor-auth-api, a name a browser cannot resolve."
            exit 1
          fi
          echo "DISABLE_HTTPS_REDIRECTION=true is active."

  deploy-frontends:
    name: Deploy Frontend UIs
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    # The frontends bake the gateway origin into the bundle at build time, so they must be
    # built after the gateway app exists and its FQDN can be read back from Azure.
    needs: deploy-api-gateway
    environment: Production
    strategy:
      matrix:
        include:
          - service: harbor-admin-ui
            context: src/frontend/harbor-admin
            dockerfile: src/frontend/harbor-admin/Dockerfile
          - service: harbor-web-ui
            context: src/frontend/harbor-web
            dockerfile: src/frontend/harbor-web/Dockerfile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve API Gateway URL
        id: get-gateway
        run: |
          GATEWAY_FQDN=$(az containerapp show --name harbor-api-gateway --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv | tr -d '[:space:]')
          if [ -z "$GATEWAY_FQDN" ]; then
            echo "::error::harbor-api-gateway has no external FQDN. Check that ingress is external and the environment is publicly accessible."
            exit 1
          fi
          echo "GATEWAY_URL=https://$GATEWAY_FQDN" >> $GITHUB_ENV

      - name: Log in to ACR
        run: docker login ${{ env.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Frontend Image
        run: |
          # The build context must be the app directory, not the repo root. Each frontend is a
          # self-contained Vite project, so the root context made COPY package*.json pick up the
          # repo-level package-lock.json (there is no root package.json) and left nginx.conf
          # unreachable at the context root.
          docker build \
            --build-arg VITE_API_BASE_URL=$GATEWAY_URL/api \
            -f ${{ matrix.dockerfile }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ env.DEPLOY_SHA }} \
            ${{ matrix.context }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ env.DEPLOY_SHA }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          registryUrl: ${{ env.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}
          containerAppName: ${{ matrix.service }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.ACA_ENVIRONMENT }}
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ env.DEPLOY_SHA }}
          ingress: external
          targetPort: 80

      - name: Cap frontend scaling
        run: |
          for attempt in 1 2 3; do
            if az containerapp update \
              --name "${{ matrix.service }}" \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --min-replicas 0 \
              --max-replicas 1 \
              --cpu 0.5 \
              --memory 1Gi; then
              exit 0
            fi
            echo "Azure Container Apps update failed (attempt $attempt/3); retrying..."
            sleep 15
          done
          exit 1

  deploy-api-gateway:
    name: Deploy API Gateway
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    needs: deploy-backend-apis
    environment: Production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACA Environment Domain
        run: |
          DOMAIN=$(az containerapp env show -n ${{ env.ACA_ENVIRONMENT }} -g ${{ env.RESOURCE_GROUP }} --query properties.defaultDomain -o tsv | tr -d '[:space:]')
          echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV

      # Ask Azure for each backend's FQDN instead of constructing it.
      #
      # Two earlier attempts failed, both from guessing the name. The short name
      # (http://harbor-auth-api) does not resolve from another container app, and the
      # documented internal FQDN (harbor-auth-api.internal.<domain>) resolves but presents a
      # certificate issued for the non-internal name, giving RemoteCertificateNameMismatch.
      # The FQDN the control plane actually reports matches the certificate, and because
      # ingress is internal the app stays unreachable from outside the environment.
      - name: Resolve backend FQDNs
        run: |
          resolve () {
            local fqdn
            fqdn=$(az containerapp show -n "$1" -g ${{ env.RESOURCE_GROUP }} \
              --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null | tr -d '[:space:]')
            if [ -z "$fqdn" ]; then
              fqdn="$1.$DOMAIN"
              echo "::warning::$1 has no reported FQDN yet; falling back to $fqdn"
            fi
            echo "$2=https://$fqdn" >> $GITHUB_ENV
          }
          resolve harbor-auth-api AUTH_FQDN
          resolve harbor-project-api PROJECT_FQDN
          resolve harbor-env-api ENV_FQDN
          resolve harbor-deploy-api DEPLOY_FQDN
          resolve harbor-report-api REPORTING_FQDN

      - name: Deploy API Gateway to ACA
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: ${{ env.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}
          containerAppName: harbor-api-gateway
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.ACA_ENVIRONMENT }}
          imageToBuild: ${{ env.ACR_LOGIN_SERVER }}/harbor-api-gateway:${{ env.DEPLOY_SHA }}
          dockerfilePath: src/backend/Harbor.ApiGateway/Dockerfile
          ingress: external
          targetPort: 8080

      - name: Configure API Gateway environment variables
        run: |
          for attempt in 1 2 3; do
            if az containerapp update \
              --name harbor-api-gateway \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --set-env-vars \
                "ReverseProxy__Clusters__authCluster__Destinations__destination1__Address=$AUTH_FQDN" \
                "ReverseProxy__Clusters__projectCluster__Destinations__destination1__Address=$PROJECT_FQDN" \
                "ReverseProxy__Clusters__environmentCluster__Destinations__destination1__Address=$ENV_FQDN" \
                "ReverseProxy__Clusters__deploymentCluster__Destinations__destination1__Address=$DEPLOY_FQDN" \
                "ReverseProxy__Clusters__reportingCluster__Destinations__destination1__Address=$REPORTING_FQDN" \
                "ALLOWED_ORIGINS=https://harbor-admin-ui.$DOMAIN,https://harbor-web-ui.$DOMAIN" \
                "FRONTEND_URL=https://harbor-web-ui.$DOMAIN" \
              --min-replicas 0 \
              --max-replicas 1 \
              --cpu 0.5 \
              --memory 1Gi; then
              exit 0
            fi
            echo "Azure API Gateway update failed (attempt $attempt/3); retrying..."
            sleep 15
          done
          exit 1

      - name: Verify reverse proxy destinations were applied
        run: |
          DESTINATIONS=$(az containerapp show -n harbor-api-gateway -g ${{ env.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].env[?starts_with(name,'ReverseProxy')].value" -o tsv)
          echo "Active destinations:"
          echo "$DESTINATIONS"
          # A bare short name does not resolve, and a .internal. FQDN fails certificate
          # validation. The destination must be the FQDN the control plane reports.
          if echo "$DESTINATIONS" | grep -q '\.internal\.'; then
            echo "::error::gateway points at a .internal. FQDN, which fails TLS name validation."
            exit 1
          fi
          if echo "$DESTINATIONS" | grep -qv '^https://'; then
            echo "::error::every destination must be an https:// FQDN that matches the environment certificate."
            exit 1
          fi
          for app in harbor-auth-api harbor-project-api harbor-env-api harbor-deploy-api harbor-report-api; do
            if ! echo "$DESTINATIONS" | grep -q "://$app\."; then
              echo "::error::no destination for $app among the active destinations"
              exit 1
            fi
          done
          echo "All five destinations are certificate-matching FQDNs."



