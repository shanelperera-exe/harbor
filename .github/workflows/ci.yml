name: CI Pipeline

on:
  push:
    branches: ["main", "master", "develop", "feature/*"]
  pull_request:
    branches: ["main", "master", "develop"]

# Cancel in-progress runs for the same PR/branch to save runner minutes.
# On main/master every push completes so no deployment SHA is lost.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "24"

# Job 1 — Build frontend
jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build all workspaces
        working-directory: src/frontend
        run: npm run build

  # Job 2 — Build backend
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

  # Job 3 — Unit and integration tests
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [build-backend]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: harboruser
          POSTGRES_PASSWORD: harborpass
          POSTGRES_DB: harbor_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harboruser -d harbor_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      kafka:
        image: apache/kafka:3.7.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        options: >-
          --health-cmd "nc -zv localhost 9092"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      # Database
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: harboruser
      POSTGRES_PASSWORD: harborpass
      POSTGRES_SSL_MODE: Prefer

      # Auth / JWT
      JWT_SECRET: super_secret_jwt_key_that_is_at_least_32_bytes_long_for_testing
      JWT_ISSUER: HarborAuth
      JWT_AUDIENCE: HarborClients
      ADMIN_EMAIL: admin@harbor.local
      ADMIN_PASSWORD: Admin123!

      # URLs
      API_GATEWAY_URL: http://localhost:5053
      AUTH_SERVICE_URL: http://localhost:5196
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost:8080,http://localhost:8081"

      # SMTP
      SMTP_HOST: localhost
      SMTP_PORT: "25"
      SMTP_USERNAME: test
      SMTP_PASSWORD: test
      SMTP_FROM_NAME: Harbor CI
      SMTP_FROM_EMAIL: ci@harbor.local

      # GitHub App
      GH_APP_ID: "0"
      GH_APP_CLIENT_ID: test-gh-client-id
      GH_APP_CLIENT_SECRET: test-gh-client-secret
      GH_APP_PRIVATE_KEY_BASE64: ""
      GH_APP_SLUG: harbor-test
      GH_APP_WEBHOOK_SECRET: test-gh-webhook-secret
      GH_API_BASE_URL: https://api.github.com/
      GITHUB_WEBHOOK_SECRET: test-github-webhook-secret

      # Google OAuth
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret

      # Kafka
      KAFKA_CONNECTION_STRING: ""
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      KAFKA_DEPLOYMENT_TOPIC: deployment-events
      KAFKA_CONSUMER_GROUP_ID: harbor-ci-group

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Harbor service databases
        run: |
          command -v psql >/dev/null || (sudo apt-get update -y && sudo apt-get install -y --no-install-recommends postgresql-client)
          export PGPASSWORD=$POSTGRES_PASSWORD
          for database in harbor_auth harbor_project harbor_env harbor_deploy harbor_reporting; do
            psql -h localhost -p 5432 -U "$POSTGRES_USER" -d harbor_db \
              -tc "SELECT 1 FROM pg_database WHERE datname = '$database'" |
              grep -q 1 || psql -h localhost -p 5432 -U "$POSTGRES_USER" -d harbor_db \
              -c "CREATE DATABASE $database"
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build solution (Debug)
        run: dotnet build --no-restore --configuration Debug

      - name: Generate runtime secrets
        run: echo "ENVIRONMENT_SECRETS_KEY=$(openssl rand -base64 32)" >> $GITHUB_ENV

      - name: Run unit and integration tests
        run: |
          dotnet test --no-build --configuration Debug --verbosity normal \
            --filter "FullyQualifiedName!~Harbor.E2ETests" \
            --logger "trx;LogFileName=unit.trx"

      - name: Upload unit and integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: "**/TestResults/unit.trx"
          if-no-files-found: ignore
