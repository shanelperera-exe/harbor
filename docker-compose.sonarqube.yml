version: '3.8'

services:
  sonarqube:
    image: sonarqube:latest
    container_name: harbor-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - harbor_sonarqube_data:/opt/sonarqube/data
      - harbor_sonarqube_extensions:/opt/sonarqube/extensions
      - harbor_sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

volumes:
  harbor_sonarqube_data:
    name: harbor_sonarqube_data
  harbor_sonarqube_extensions:
    name: harbor_sonarqube_extensions
  harbor_sonarqube_logs:
    name: harbor_sonarqube_logs
