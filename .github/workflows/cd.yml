name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
  workflow_dispatch:

# Deployments to production must never cancel each other mid-flight.
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: rg-harbor-centralindia
  ACA_ENVIRONMENT: harbor-env-prod
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 — Deploy all backend API Container Apps (matrix, runs in parallel)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  deploy-backend-apis:
    name: Deploy Backend APIs
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: Production
    strategy:
      matrix:
        include:
          - service: harbor-auth-api
            dockerfile: src/backend/Harbor.Authentication/Dockerfile
          - service: harbor-project-api
            dockerfile: src/backend/Harbor.Project/Dockerfile
          - service: harbor-env-api
            dockerfile: src/backend/Harbor.Environment/Dockerfile
          - service: harbor-deploy-api
            dockerfile: src/backend/Harbor.Deployment/Dockerfile
          - service: harbor-report-api
            dockerfile: src/backend/Harbor.Reporting/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Backend APIs use internal ingress in the same ACA environment.
      # Service-to-service communication uses the application names directly.
      - name: Configure backend URLs
        run: |
          # AUTH_SERVICE_URL is consumed by Harbor.Deployment for service-to-service
          # calls to the Auth API (JWT validation). Use the internal service name so that
          # this call stays within the ACA environment.
          echo "AUTH_SERVICE_URL=http://harbor-auth-api" >> $GITHUB_ENV

      - name: Build and deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: ${{ env.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}
          containerAppName: ${{ matrix.service }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.ACA_ENVIRONMENT }}
          imageToBuild: ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ env.DEPLOY_SHA }}
          dockerfilePath: ${{ matrix.dockerfile }}
          ingress: internal
          targetPort: 8080

      - name: Apply backend runtime configuration
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ENVIRONMENT_SECRETS_KEY: ${{ secrets.ENVIRONMENT_SECRETS_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GH_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
          GH_APP_PRIVATE_KEY_BASE64: ${{ secrets.GH_APP_PRIVATE_KEY_BASE64 }}
          GH_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
          KAFKA_CONNECTION_STRING: ${{ secrets.KAFKA_CONNECTION_STRING }}
        run: |
          for attempt in 1 2 3; do
            if az containerapp update \
              --name "${{ matrix.service }}" \
              --resource-group "$RESOURCE_GROUP" \
              --set-env-vars \
                "POSTGRES_SERVER=${{ vars.POSTGRES_SERVER }}" \
                "POSTGRES_PORT=${{ vars.POSTGRES_PORT }}" \
                "POSTGRES_DATABASE=${{ vars.POSTGRES_DATABASE }}" \
                "POSTGRES_USER=${{ vars.POSTGRES_USER }}" \
                "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
                "POSTGRES_SSL_MODE=Require" \
                "JWT_SECRET=$JWT_SECRET" \
                "JWT_ISSUER=${{ vars.JWT_ISSUER }}" \
                "JWT_AUDIENCE=${{ vars.JWT_AUDIENCE }}" \
                "ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }}" \
                "ADMIN_PASSWORD=$ADMIN_PASSWORD" \
                "KAFKA_CONNECTION_STRING=$KAFKA_CONNECTION_STRING" \
                "SMTP_HOST=${{ vars.SMTP_HOST }}" \
                "SMTP_PORT=${{ vars.SMTP_PORT }}" \
                "SMTP_USERNAME=${{ vars.SMTP_USERNAME }}" \
                "SMTP_PASSWORD=$SMTP_PASSWORD" \
                "SMTP_FROM_NAME=${{ vars.SMTP_FROM_NAME }}" \
                "SMTP_FROM_EMAIL=${{ vars.SMTP_FROM_EMAIL }}" \
                "ENVIRONMENT_SECRETS_KEY=$ENVIRONMENT_SECRETS_KEY" \
                "GH_APP_ID=${{ vars.GH_APP_ID }}" \
                "GH_APP_CLIENT_ID=${{ vars.GH_APP_CLIENT_ID }}" \
                "GH_APP_CLIENT_SECRET=$GH_APP_CLIENT_SECRET" \
                "GH_APP_PRIVATE_KEY_BASE64=$GH_APP_PRIVATE_KEY_BASE64" \
                "GH_APP_SLUG=${{ vars.GH_APP_SLUG }}" \
                "GH_APP_WEBHOOK_SECRET=$GH_APP_WEBHOOK_SECRET" \
                "GH_API_BASE_URL=${{ vars.GH_API_BASE_URL }}" \
                "GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}" \
                "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" \
                "AUTH_SERVICE_URL=$AUTH_SERVICE_URL" \
                "FRONTEND_URL=https://harborapp.tech" \
                "API_GATEWAY_URL=https://api.harborapp.tech" \
                "ALLOWED_ORIGINS=https://harborapp.tech,https://admin.harborapp.tech" \
                "REDIS_CONNECTION_STRING=${{ vars.REDIS_CONNECTION_STRING }}" \
                "REDIS_INSTANCE_NAME=${{ vars.REDIS_INSTANCE_NAME }}" \
              --min-replicas 0 \
              --max-replicas 1 \
              --cpu 0.5 \
              --memory 1Gi; then
              exit 0
            fi
            echo "Update failed (attempt $attempt/3); retrying in 15s..."
            sleep 15
          done
          exit 1

# ─────────────────────────────────────────────────────────────────────────────
# Job 2 — Deploy the API Gateway (depends on all backend APIs)
# ─────────────────────────────────────────────────────────────────────────────
  deploy-api-gateway:
    name: Deploy API Gateway
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    needs: deploy-backend-apis
    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Backend APIs run with internal ingress in the same ACA environment.
      # The gateway must reach them via their internal ACA service names.
      # Do NOT use the public FQDN or .internal. FQDNs for these calls.
      - name: Resolve backend internal URLs
        run: |
          echo "AUTH_FQDN=http://harbor-auth-api" >> $GITHUB_ENV
          echo "PROJECT_FQDN=http://harbor-project-api" >> $GITHUB_ENV
          echo "ENV_FQDN=http://harbor-env-api" >> $GITHUB_ENV
          echo "DEPLOY_FQDN=http://harbor-deploy-api" >> $GITHUB_ENV
          echo "REPORTING_FQDN=http://harbor-report-api" >> $GITHUB_ENV

      - name: Build and deploy API Gateway to ACA
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: ${{ env.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}
          containerAppName: harbor-api-gateway
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.ACA_ENVIRONMENT }}
          imageToBuild: ${{ env.ACR_LOGIN_SERVER }}/harbor-api-gateway:${{ env.DEPLOY_SHA }}
          dockerfilePath: src/backend/Harbor.ApiGateway/Dockerfile
          ingress: external
          targetPort: 8080

      - name: Configure API Gateway environment variables
        run: |
          for attempt in 1 2 3; do
            if az containerapp update \
              --name harbor-api-gateway \
              --resource-group "$RESOURCE_GROUP" \
              --set-env-vars \
                "ReverseProxy__Clusters__authCluster__Destinations__destination1__Address=$AUTH_FQDN" \
                "ReverseProxy__Clusters__projectCluster__Destinations__destination1__Address=$PROJECT_FQDN" \
                "ReverseProxy__Clusters__environmentCluster__Destinations__destination1__Address=$ENV_FQDN" \
                "ReverseProxy__Clusters__deploymentCluster__Destinations__destination1__Address=$DEPLOY_FQDN" \
                "ReverseProxy__Clusters__reportingCluster__Destinations__destination1__Address=$REPORTING_FQDN" \
                "ALLOWED_ORIGINS=https://harborapp.tech,https://admin.harborapp.tech" \
                "FRONTEND_URL=https://harborapp.tech" \
              --min-replicas 0 \
              --max-replicas 1 \
              --cpu 0.5 \
              --memory 1Gi; then
              exit 0
            fi
            echo "Update failed (attempt $attempt/3); retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Verify gateway destinations are valid
        run: |
          DESTINATIONS=$(az containerapp show \
            -n harbor-api-gateway -g "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].env[?starts_with(name,'ReverseProxy')].value" \
            -o tsv)
          echo "Active destinations:"
          echo "$DESTINATIONS"

          # Every YARP destination must be the internal ACA service name over HTTP.
          for app in harbor-auth-api harbor-project-api harbor-env-api harbor-deploy-api harbor-report-api; do
            if ! echo "$DESTINATIONS" | grep -q "^http://$app$"; then
              echo "::error::No internal destination for http://$app found among active destinations."
              exit 1
            fi
          done

          # Ensure there are no accidental public or .internal. FQDNs.
          if echo "$DESTINATIONS" | grep -q '\.azurecontainerapps\.io'; then
            echo "::error::Destinations must not use public or .internal. azurecontainerapps.io FQDNs."
            exit 1
          fi

          echo "All five destinations are valid ACA internal service names. ✓"

# ─────────────────────────────────────────────────────────────────────────────
# Job 3 — Deploy frontend UIs (depends on gateway so the FQDN can be read back)
# ─────────────────────────────────────────────────────────────────────────────
  deploy-frontends:
    name: Deploy Frontend UIs
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    # Frontends bake the gateway origin into the bundle at build time, so they
    # must be built after the gateway app exists and its FQDN can be read back.
    needs: deploy-api-gateway
    environment: Production
    strategy:
      matrix:
        include:
          - service: harbor-admin-ui
            context: src/frontend/harbor-admin
            dockerfile: src/frontend/harbor-admin/Dockerfile
          - service: harbor-web-ui
            context: src/frontend/harbor-web
            dockerfile: src/frontend/harbor-web/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve API Gateway URL
        run: |
          echo "GATEWAY_URL=https://api.harborapp.tech" >> $GITHUB_ENV

      - name: Log in to ACR
        run: docker login "$ACR_LOGIN_SERVER" -u "${{ secrets.ACR_USERNAME }}" -p "${{ secrets.ACR_PASSWORD }}"

      - name: Build and push frontend image
        run: |
          # The build context must be the app directory, not the repo root. Each frontend is a
          # self-contained Vite project; using the repo root caused COPY package*.json to pick
          # up the repo-level package-lock.json (no root package.json exists) and left
          # nginx.conf unreachable at the context root.
          docker build \
            --build-arg VITE_API_BASE_URL="$GATEWAY_URL/api" \
            --build-arg VITE_GITHUB_APP_SLUG="${{ vars.GH_APP_SLUG }}" \
            -f "${{ matrix.dockerfile }}" \
            -t "$ACR_LOGIN_SERVER/${{ matrix.service }}:$DEPLOY_SHA" \
            "${{ matrix.context }}"
          docker push "$ACR_LOGIN_SERVER/${{ matrix.service }}:$DEPLOY_SHA"

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          registryUrl: ${{ env.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}
          containerAppName: ${{ matrix.service }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.ACA_ENVIRONMENT }}
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ env.DEPLOY_SHA }}
          ingress: external
          targetPort: 80

      - name: Cap frontend scaling
        run: |
          for attempt in 1 2 3; do
            if az containerapp update \
              --name "${{ matrix.service }}" \
              --resource-group "$RESOURCE_GROUP" \
              --min-replicas 0 \
              --max-replicas 1 \
              --cpu 0.5 \
              --memory 1Gi; then
              exit 0
            fi
            echo "Update failed (attempt $attempt/3); retrying in 15s..."
            sleep 15
          done
          exit 1
