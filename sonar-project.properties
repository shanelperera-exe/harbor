# ==============================================================================
# SonarQube / SonarCloud Configuration for Harbor Microservices Platform
# Module: SE3112 - Advanced Software Engineering (Quality & Metrics)
# ==============================================================================

sonar.organization=harbor-platform
sonar.projectKey=Harbor
sonar.projectName=Harbor Microservices Platform
sonar.projectVersion=1.0.0
sonar.host.url=https://sonarcloud.io

# Source & Test Code Structure (Focus strictly on .NET microservices)
sonar.sources=src/backend,src/shared
sonar.tests=tests/unit,tests/integration

# Language & Encoding
sonar.sourceEncoding=UTF-8

# .NET Coverage & Test Results Integration
sonar.cs.cobertura.reportsPaths=TestResults/**/coverage.cobertura.xml
sonar.cs.vstest.reportsPaths=TestResults/**/*.trx

# Exclusions: Focus strictly on .NET backend microservices & C# code
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/wwwroot/**,**/*.jmx,**/*.jtl,**/TestResults/**,**/StrykerOutput/**,**/frontend/**,**/web/**,**/*.js,**/*.ts,**/*.tsx,**/*.jsx,**/*.css,**/*.scss,**/*.html
sonar.coverage.exclusions=**/Program.cs,**/Migrations/**,**/Data/MigrationRunner.cs,**/Data/DatabaseInitializer.cs,**/Data/DbConnectionFactory.cs,**/DTOs/**,**/Models/**,**/Responses/**,**/Scripts/**,**/Repositories/**
sonar.scanner.skipNodeProvisioning=true

# Quality Gate Criteria
sonar.qualitygate.wait=true
