name: CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: rg-harbor-centralindia
  ACA_ENVIRONMENT: harbor-env

jobs:
  deploy-backend-apis:
    name: Deploy Backend APIs
    runs-on: ubuntu-latest
    environment: Production
    strategy:
      matrix:
        include:
          - service: harbor-auth-api
            dockerfile: src/backend/Harbor.Authentication/Dockerfile
          - service: harbor-project-api
            dockerfile: src/backend/Harbor.Project/Dockerfile
          - service: harbor-env-api
            dockerfile: src/backend/Harbor.Environment/Dockerfile
          - service: harbor-deploy-api
            dockerfile: src/backend/Harbor.Deployment/Dockerfile
          - service: harbor-report-api
            dockerfile: src/backend/Harbor.Reporting/Dockerfile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: ${{ env.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}
          containerAppName: ${{ matrix.service }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.ACA_ENVIRONMENT }}
          imageToBuild: ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ github.sha }}
          dockerfilePath: ${{ matrix.dockerfile }}
          ingress: internal
          targetPort: 8080
          environmentVariables: |
            POSTGRES_SERVER=${{ vars.POSTGRES_SERVER }}
            POSTGRES_PORT=${{ vars.POSTGRES_PORT }}
            POSTGRES_DATABASE=${{ vars.POSTGRES_DATABASE }}
            POSTGRES_USER=${{ vars.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ISSUER=${{ vars.JWT_ISSUER }}
            JWT_AUDIENCE=${{ vars.JWT_AUDIENCE }}
            ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            KAFKA_BOOTSTRAP_SERVERS=${{ vars.KAFKA_BOOTSTRAP_SERVERS }}
            KAFKA_DEPLOYMENT_TOPIC=${{ vars.KAFKA_DEPLOYMENT_TOPIC }}
            SMTP_HOST=${{ vars.SMTP_HOST }}
            SMTP_PORT=${{ vars.SMTP_PORT }}
            SMTP_USERNAME=${{ vars.SMTP_USERNAME }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            SMTP_FROM_NAME=${{ vars.SMTP_FROM_NAME }}
            SMTP_FROM_EMAIL=${{ vars.SMTP_FROM_EMAIL }}
            ENVIRONMENT_SECRETS_KEY=${{ secrets.ENVIRONMENT_SECRETS_KEY }}
            GITHUB_TOKEN=${{ secrets.GH_TOKEN }}
            GITHUB_WEBHOOK_SECRET=${{ secrets.GH_WEBHOOK_SECRET }}

  deploy-frontends:
    name: Deploy Frontend UIs
    runs-on: ubuntu-latest
    environment: Production
    strategy:
      matrix:
        include:
          - service: harbor-admin-ui
            dockerfile: src/frontend/harbor-admin/Dockerfile
          - service: harbor-web-ui
            dockerfile: src/frontend/harbor-web/Dockerfile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: docker login ${{ env.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Frontend Image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=${{ vars.API_GATEWAY_URL }}/api \
            -f ${{ matrix.dockerfile }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ github.sha }} \
            .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          registryUrl: ${{ env.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}
          containerAppName: ${{ matrix.service }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.ACA_ENVIRONMENT }}
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ github.sha }}
          ingress: external
          targetPort: 80

  deploy-api-gateway:
    name: Deploy API Gateway
    runs-on: ubuntu-latest
    needs: deploy-backend-apis
    environment: Production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACA Environment Domain
        id: get-domain
        run: |
          DOMAIN=$(az containerapp env show -n ${{ env.ACA_ENVIRONMENT }} -g ${{ env.RESOURCE_GROUP }} --query properties.defaultDomain -o tsv | tr -d '[:space:]')
          echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV

      - name: Deploy API Gateway to ACA
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: ${{ env.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}
          containerAppName: harbor-api-gateway
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.ACA_ENVIRONMENT }}
          imageToBuild: ${{ env.ACR_LOGIN_SERVER }}/harbor-api-gateway:${{ github.sha }}
          dockerfilePath: src/backend/Harbor.ApiGateway/Dockerfile
          ingress: external
          targetPort: 8080

      - name: Configure API Gateway environment variables
        run: |
          az containerapp update \
            --name harbor-api-gateway \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --set-env-vars \
              "ReverseProxy__Clusters__authCluster__Destinations__destination1__Address=https://harbor-auth-api.internal.${{ env.DOMAIN }}" \
              "ReverseProxy__Clusters__projectCluster__Destinations__destination1__Address=https://harbor-project-api.internal.${{ env.DOMAIN }}" \
              "ReverseProxy__Clusters__environmentCluster__Destinations__destination1__Address=https://harbor-env-api.internal.${{ env.DOMAIN }}" \
              "ReverseProxy__Clusters__deploymentCluster__Destinations__destination1__Address=https://harbor-deploy-api.internal.${{ env.DOMAIN }}" \
              "ReverseProxy__Clusters__reportingCluster__Destinations__destination1__Address=https://harbor-report-api.internal.${{ env.DOMAIN }}" \
              "ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}"



