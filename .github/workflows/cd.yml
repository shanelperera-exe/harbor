name: CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    # Dynamically select the GitHub Environment based on the branch
    environment: 
      name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Frontend
      working-directory: ./src/frontend
      run: |
        npm install
        npm run build

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build and Publish Backend
      run: dotnet publish --configuration Release --output ./publish

    - name: Generate .env file for deployment
      run: |
        echo "POSTGRES_SERVER=${{ vars.POSTGRES_SERVER }}" >> ./publish/.env
        echo "POSTGRES_PORT=${{ vars.POSTGRES_PORT }}" >> ./publish/.env
        echo "POSTGRES_DATABASE=${{ vars.POSTGRES_DATABASE }}" >> ./publish/.env
        echo "POSTGRES_USER=${{ vars.POSTGRES_USER }}" >> ./publish/.env
        echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> ./publish/.env
        echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> ./publish/.env
        echo "JWT_ISSUER=${{ vars.JWT_ISSUER }}" >> ./publish/.env
        echo "JWT_AUDIENCE=${{ vars.JWT_AUDIENCE }}" >> ./publish/.env
        echo "ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }}" >> ./publish/.env
        echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> ./publish/.env
        echo "API_GATEWAY_URL=${{ vars.API_GATEWAY_URL }}" >> ./publish/.env
        echo "KAFKA_BOOTSTRAP_SERVERS=${{ vars.KAFKA_BOOTSTRAP_SERVERS }}" >> ./publish/.env
        echo "KAFKA_DEPLOYMENT_TOPIC=${{ vars.KAFKA_DEPLOYMENT_TOPIC }}" >> ./publish/.env
        echo "SMTP_HOST=${{ vars.SMTP_HOST }}" >> ./publish/.env
        echo "SMTP_PORT=${{ vars.SMTP_PORT }}" >> ./publish/.env
        echo "SMTP_USERNAME=${{ vars.SMTP_USERNAME }}" >> ./publish/.env
        echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> ./publish/.env
        echo "SMTP_FROM_NAME=${{ vars.SMTP_FROM_NAME }}" >> ./publish/.env
        echo "SMTP_FROM_EMAIL=${{ vars.SMTP_FROM_EMAIL }}" >> ./publish/.env

    - name: Deploy to Server
      run: |
        echo "Deploying to ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}..."
        # Add your specific deployment commands here
        # E.g., copying ./publish to your server via SCP, or pushing a Docker container
