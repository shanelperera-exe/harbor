services:
  postgres:
    image: postgres:15-alpine
    container_name: harbor-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE:-harbor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: harbor-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    container_name: harbor-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: src/backend/Harbor.ApiGateway/Dockerfile
    container_name: harbor-api-gateway
    env_file: .env
    ports:
      - "5000:8080"
    volumes:
      - dp_keys:/root/.aspnet/DataProtection-Keys
    restart: unless-stopped

  authentication-service:
    build:
      context: .
      dockerfile: src/backend/Harbor.Authentication/Dockerfile
    container_name: harbor-authentication
    env_file: .env
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "5001:8080"
    volumes:
      - dp_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      - postgres
    restart: unless-stopped

  project-service:
    build:
      context: .
      dockerfile: src/backend/Harbor.Project/Dockerfile
    container_name: harbor-project
    env_file: .env
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://authentication-service:8080}
    ports:
      - "5002:8080"
    volumes:
      - dp_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      - postgres
    restart: unless-stopped

  environment-service:
    build:
      context: .
      dockerfile: src/backend/Harbor.Environment/Dockerfile
    container_name: harbor-environment
    env_file: .env
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
    ports:
      - "5003:8080"
    volumes:
      - dp_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      - postgres
    restart: unless-stopped

  deployment-service:
    build:
      context: .
      dockerfile: src/backend/Harbor.Deployment/Dockerfile
    container_name: harbor-deployment
    env_file: .env
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://authentication-service:8080}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_DEPLOYMENT_TOPIC: ${KAFKA_DEPLOYMENT_TOPIC:-deployment-events}
    ports:
      - "5004:8080"
    volumes:
      - dp_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      - postgres
      - kafka
    restart: unless-stopped

  reporting-service:
    build:
      context: .
      dockerfile: src/backend/Harbor.Reporting/Dockerfile
    container_name: harbor-reporting
    env_file: .env
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
    ports:
      - "5005:8080"
    volumes:
      - dp_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      - postgres
    restart: unless-stopped

  harbor-web:
    build:
      context: src/frontend/harbor-web
      dockerfile: Dockerfile
    container_name: harbor-web
    ports:
      - "8080:80"
    restart: unless-stopped

  harbor-admin:
    build:
      context: src/frontend/harbor-admin
      dockerfile: Dockerfile
    container_name: harbor-admin
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  postgres_data:
  dp_keys:
