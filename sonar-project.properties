# ==============================================================================
# SonarQube / SonarCloud Configuration for Harbor Microservices Platform
# Module: SE3112 - Advanced Software Engineering (Quality & Metrics)
# ==============================================================================

sonar.projectKey=harbor-microservices-platform
sonar.projectName=Harbor Microservices Platform
sonar.projectVersion=1.0.0

# Source & Test Code Structure
sonar.sources=src
sonar.tests=tests

# Language & Encoding
sonar.sourceEncoding=UTF-8

# .NET Coverage & Test Results Integration
sonar.cs.cobertura.reportsPaths=TestResults/**/coverage.cobertura.xml
sonar.cs.vstest.reportsPaths=TestResults/**/*.trx

# Exclusions: Ignore compiled assets, dependency caches, and test artifacts
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/wwwroot/**,**/*.jmx,**/*.jtl,**/TestResults/**,**/StrykerOutput/**
sonar.coverage.exclusions=**/Program.cs,**/Migrations/**,**/Data/DatabaseInitializer.cs,**/Data/DbConnectionFactory.cs,**/DTOs/**,**/Models/**,**/Responses/**

# Quality Gate Criteria
sonar.qualitygate.wait=true
