<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Fallback for web fonts */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body { 
            font-family: 'PP Neue Montreal', 'Roobert', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            color: #090909; 
            background-color: #f5f5f5; 
            line-height: 1.6; 
            margin: 0; 
            padding: 40px 20px; 
            -webkit-font-smoothing: antialiased;
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background-color: #ffffff; 
            border-radius: 12px; 
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }
        .header {
            background-color: #2563eb;
            padding: 30px;
            text-align: center;
        }
        .header svg {
            width: 48px;
            height: 48px;
        }
        .content {
            padding: 40px;
        }
        h2 { 
            color: #090909; 
            font-size: 24px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 16px;
            color: #4a4a4a;
            margin-bottom: 24px;
        }
        .btn { 
            display: inline-block; 
            padding: 12px 28px; 
            background-color: #2563eb; 
            color: #ffffff !important; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: 500; 
            margin-top: 10px; 
            margin-bottom: 24px; 
            font-family: 'PP Neue Montreal', 'Inter', sans-serif;
            text-align: center;
        }
        .footer { 
            margin-top: 40px; 
            font-size: 14px; 
            color: #888888; 
            border-top: 1px solid #eaeaea; 
            padding-top: 30px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- Harbor Logo (Cloudinary converted to PNG for email compatibility) -->
            <img src="https://res.cloudinary.com/cjqr5emw/image/upload/v1788492039/harbor_light_notext.png" alt="Harbor" style="width: 48px; height: 48px; display: block; margin: 0 auto; border: 0;" />
        </div>
        <div class="content">
            <h2>Password Reset Request</h2>
            <p>Hi there,</p>
            <p>We received a request to reset your Harbor password. Click the button below to choose a new one:</p>
            <a href="{{ResetLink}}" class="btn">Reset Password</a>
            <p style="font-size: 14px; color: #888;">If you didn't request this, you can safely ignore this email. Your password won't change until you create a new one.</p>
            <div class="footer">
                Thanks,<br/>The Harbor Team
            </div>
        </div>
    </div>
</body>
</html>
