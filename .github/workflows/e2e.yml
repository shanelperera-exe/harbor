name: E2E Pipeline

on:
  # 1. Scheduled nightly run (catches regressions across branches without slowing down PRs)
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC

  # 2. Manual on-demand execution via GitHub UI / CLI
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Test filter expression (e.g., FullyQualifiedName~DeploymentsTests, or leave empty for all)"
        required: false
        default: ""

  # 3. Pull Requests: Opt-in via 'run-e2e' or 'e2e' label
  pull_request:
    branches: ["main", "master", "develop"]
    types: [labeled, synchronize, reopened]

  # 4. Post-merge execution on main/master
  push:
    branches: ["main", "master"]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "24"

jobs:
  e2e-tests:
    name: End-to-End Tests (Selenium)
    # Only run on PRs if the 'run-e2e' or 'e2e' label is present; always run on schedule, push, or dispatch
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'run-e2e') ||
        contains(github.event.pull_request.labels.*.name, 'e2e')
      ))
    runs-on: ubuntu-latest
    environment: Development

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: harboruser
          POSTGRES_PASSWORD: harborpass
          POSTGRES_DB: harbor_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harboruser -d harbor_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      kafka:
        image: apache/kafka:3.7.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        options: >-
          --health-cmd "nc -zv localhost 9092"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      # Database
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: harbor_db
      POSTGRES_USER: harboruser
      POSTGRES_PASSWORD: harborpass
      POSTGRES_SSL_MODE: Prefer

      # Auth / JWT
      JWT_SECRET: super_secret_jwt_key_that_is_at_least_32_bytes_long_for_testing
      JWT_ISSUER: HarborAuth
      JWT_AUDIENCE: HarborClients
      ADMIN_EMAIL: admin@harbor.local
      ADMIN_PASSWORD: Admin123!

      # URLs
      API_GATEWAY_URL: http://localhost:5053
      AUTH_SERVICE_URL: http://localhost:5196
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost:8080,http://localhost:8081"

      # SMTP
      SMTP_HOST: localhost
      SMTP_PORT: "25"
      SMTP_USERNAME: test
      SMTP_PASSWORD: test
      SMTP_FROM_NAME: Harbor E2E
      SMTP_FROM_EMAIL: e2e@harbor.local

      # GitHub App
      GH_APP_ID: "0"
      GH_APP_CLIENT_ID: test-gh-client-id
      GH_APP_CLIENT_SECRET: test-gh-client-secret
      GH_APP_PRIVATE_KEY_BASE64: ""
      GH_APP_SLUG: harbor-test
      GH_APP_WEBHOOK_SECRET: test-gh-webhook-secret
      GH_API_BASE_URL: https://api.github.com/
      GITHUB_WEBHOOK_SECRET: test-github-webhook-secret

      # Google OAuth
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret

      # Kafka
      KAFKA_CONNECTION_STRING: ""
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      KAFKA_DEPLOYMENT_TOPIC: deployment-events
      KAFKA_CONSUMER_GROUP_ID: harbor-e2e-group

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build solution (Debug)
        run: dotnet build --no-restore --configuration Debug

      - name: Generate runtime secrets
        run: echo "ENVIRONMENT_SECRETS_KEY=$(openssl rand -base64 32)" >> $GITHUB_ENV

      - name: Write .env for service startup
        run: |
          {
            echo "POSTGRES_SERVER=$POSTGRES_SERVER"
            echo "POSTGRES_PORT=$POSTGRES_PORT"
            echo "POSTGRES_DATABASE=$POSTGRES_DATABASE"
            echo "POSTGRES_USER=$POSTGRES_USER"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "POSTGRES_SSL_MODE=$POSTGRES_SSL_MODE"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "JWT_ISSUER=$JWT_ISSUER"
            echo "JWT_AUDIENCE=$JWT_AUDIENCE"
            echo "ADMIN_EMAIL=$ADMIN_EMAIL"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "API_GATEWAY_URL=$API_GATEWAY_URL"
            echo "AUTH_SERVICE_URL=$AUTH_SERVICE_URL"
            echo "FRONTEND_URL=$FRONTEND_URL"
            echo "ALLOWED_ORIGINS=$ALLOWED_ORIGINS"
            echo "SMTP_HOST=$SMTP_HOST"
            echo "SMTP_PORT=$SMTP_PORT"
            echo "SMTP_USERNAME=$SMTP_USERNAME"
            echo "SMTP_PASSWORD=$SMTP_PASSWORD"
            echo "SMTP_FROM_NAME=$SMTP_FROM_NAME"
            echo "SMTP_FROM_EMAIL=$SMTP_FROM_EMAIL"
            echo "GH_APP_ID=$GH_APP_ID"
            echo "GH_APP_CLIENT_ID=$GH_APP_CLIENT_ID"
            echo "GH_APP_CLIENT_SECRET=$GH_APP_CLIENT_SECRET"
            echo "GH_APP_PRIVATE_KEY_BASE64=$GH_APP_PRIVATE_KEY_BASE64"
            echo "GH_APP_SLUG=$GH_APP_SLUG"
            echo "GH_APP_WEBHOOK_SECRET=$GH_APP_WEBHOOK_SECRET"
            echo "GH_API_BASE_URL=$GH_API_BASE_URL"
            echo "GITHUB_WEBHOOK_SECRET=$GITHUB_WEBHOOK_SECRET"
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            echo "KAFKA_CONNECTION_STRING=$KAFKA_CONNECTION_STRING"
            echo "KAFKA_BOOTSTRAP_SERVERS=$KAFKA_BOOTSTRAP_SERVERS"
            echo "KAFKA_DEPLOYMENT_TOPIC=$KAFKA_DEPLOYMENT_TOPIC"
            echo "KAFKA_CONSUMER_GROUP_ID=$KAFKA_CONSUMER_GROUP_ID"
            echo "ENVIRONMENT_SECRETS_KEY=$ENVIRONMENT_SECRETS_KEY"
          } > .env

      - name: Start backend services
        run: |
          mkdir -p /tmp/harbor-logs
          dotnet run --project src/backend/Harbor.Authentication --no-build > /tmp/harbor-logs/auth.log 2>&1 &

          ReverseProxy__Clusters__authCluster__Destinations__destination1__Address=http://localhost:5196 \
          ReverseProxy__Clusters__projectCluster__Destinations__destination1__Address=http://localhost:5079 \
          ReverseProxy__Clusters__deploymentCluster__Destinations__destination1__Address=http://localhost:5288 \
          ReverseProxy__Clusters__environmentCluster__Destinations__destination1__Address=http://localhost:5292 \
          ReverseProxy__Clusters__reportingCluster__Destinations__destination1__Address=http://localhost:5243 \
          dotnet run --project src/backend/Harbor.ApiGateway --no-build > /tmp/harbor-logs/gateway.log 2>&1 &

          dotnet run --project src/backend/Harbor.Project --no-build > /tmp/harbor-logs/project.log 2>&1 &
          dotnet run --project src/backend/Harbor.Deployment --no-build > /tmp/harbor-logs/deployment.log 2>&1 &
          dotnet run --project src/backend/Harbor.Environment --no-build > /tmp/harbor-logs/environment.log 2>&1 &
          dotnet run --project src/backend/Harbor.Reporting --no-build > /tmp/harbor-logs/reporting.log 2>&1 &

          wait_for_http() {
            local name="$1" url="$2" logfile="$3"
            local max=30
            for i in $(seq 1 "$max"); do
              if curl -sf -o /dev/null "$url"; then
                echo "✓ $name is ready after ${i}s"
                return 0
              fi
              sleep 1
            done
            echo "::error::$name did not become ready at $url within ${max}s"
            if [ -f "$logfile" ]; then
              echo "=== Recent logs from $name ($logfile) ==="
              tail -n 50 "$logfile"
            fi
            return 1
          }

          wait_for_http "Harbor.Authentication" "http://localhost:5196/swagger/v1/swagger.json" "/tmp/harbor-logs/auth.log"
          wait_for_http "Harbor.ApiGateway"     "http://localhost:5053/health"                  "/tmp/harbor-logs/gateway.log"
          wait_for_http "Harbor.Project"        "http://localhost:5079/swagger/v1/swagger.json" "/tmp/harbor-logs/project.log"
          wait_for_http "Harbor.Deployment"     "http://localhost:5288/swagger/v1/swagger.json" "/tmp/harbor-logs/deployment.log"
          wait_for_http "Harbor.Environment"    "http://localhost:5292/swagger/v1/swagger.json" "/tmp/harbor-logs/environment.log"
          wait_for_http "Harbor.Reporting"      "http://localhost:5243/swagger/v1/swagger.json" "/tmp/harbor-logs/reporting.log"

      - name: Setup Node.js (for frontend dev server)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Start frontend dev server
        working-directory: src/frontend
        run: |
          VITE_API_BASE_URL=http://localhost:5053/api npm run dev -- --port 5173 > /tmp/harbor-logs/frontend.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "http://localhost:5173/"; then
              echo "✓ Frontend is ready after ${i}s"
              curl -sf "http://localhost:5173/src/main.tsx" > /dev/null || true
              curl -sf "http://localhost:5173/src/pages/auth/Login.tsx" > /dev/null || true
              curl -sf "http://localhost:5173/src/pages/auth/CreateAccount.tsx" > /dev/null || true
              curl -sf "http://localhost:5173/src/pages/deployments/Deployments.tsx" > /dev/null || true
              curl -sf "http://localhost:5173/src/components/ui/FilterDropdown.tsx" > /dev/null || true
              # Pre-warm the Reports route for DeploymentReportTests
              curl -sf "http://localhost:5173/src/pages/reports/DeploymentReport.tsx" > /dev/null || true
              sleep 3
              break
            fi
            sleep 1
          done

          if ! curl -sf -o /dev/null "http://localhost:5173/"; then
            echo "::error::Frontend did not become ready within 30s"
            if [ -f "/tmp/harbor-logs/frontend.log" ]; then
              echo "=== Recent frontend logs ==="
              tail -n 50 /tmp/harbor-logs/frontend.log
            fi
            exit 1
          fi

      - name: Install postgresql-client
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Seed deployment test data
        run: |
          chmod +x scripts/ci/seed-deployment-data.sh
          ./scripts/ci/seed-deployment-data.sh
        env:
          AUTH_URL: http://localhost:5196
          POSTGRES_CONTAINER: ""
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: harboruser
          POSTGRES_PASSWORD: harborpass
          POSTGRES_DATABASE: harbor_db

      - name: Run E2E tests
        run: |
          FILTER_ARG=""
          if [ -n "${{ github.event.inputs.test_filter }}" ]; then
            echo "Running with filter: ${{ github.event.inputs.test_filter }}"
            FILTER_ARG="--filter ${{ github.event.inputs.test_filter }}"
          fi

          dotnet test --no-build --configuration Debug --verbosity normal \
            tests/Harbor.E2ETests/Harbor.E2ETests.csproj \
            $FILTER_ARG \
            --logger "trx;LogFileName=e2e.trx"

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-e2e
          path: "tests/Harbor.E2ETests/TestResults/e2e.trx"
          if-no-files-found: ignore

      - name: Upload service debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: /tmp/harbor-logs/*.log
          if-no-files-found: ignore
